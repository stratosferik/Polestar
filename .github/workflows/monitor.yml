name: Polestar stock monitor

on:
  schedule:
    - cron: '17 5,11,17 * * *'   # 3x a day (UTC)
  push:                          # also run when the monitor itself changes
    branches: [main]
    paths: ['src/**', 'test/**', 'package.json', '.github/workflows/**']
  workflow_dispatch:
    inputs:
      deadline:
        description: 'Deadline YYYY-MM-DD (blank = 31 Dec this year)'
        required: false

permissions:
  contents: write
  issues: write

concurrency: polestar-monitor

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Test
        run: npm test

      - name: Check stock
        id: monitor
        env:
          DEADLINE: ${{ inputs.deadline }}
        run: npm run monitor

      - name: Upload debug files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-${{ github.run_id }}
          path: debug/
          retention-days: 7

      - name: Save history
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "Stock check $(date -u +%Y-%m-%dT%H:%MZ)"
          git push

      - name: Alert on change
        if: success() && hashFiles('debug/change.md') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TITLE="Polestar 4 stock alerts"
          NUM=$(gh issue list --state open --search "\"$TITLE\" in:title" --json number --jq '.[0].number')
          if [ -z "$NUM" ]; then
            gh issue create --title "$TITLE" --body "Comments are added here whenever the number of cars deliverable before the deadline changes." 
            NUM=$(gh issue list --state open --search "\"$TITLE\" in:title" --json number --jq '.[0].number')
          fi
          gh issue comment "$NUM" --body-file debug/change.md
